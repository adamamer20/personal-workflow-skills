exclude: ^(?:plugins/.*|scripts/validate\.py|tests/test_handoff_hooks\.py)$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/reviews/evidence/human-terminal-ui/conversation-.*\.svg$
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        # Reference-preserving relocation of the existing canonical plan snapshot.
        exclude: ^docs/reviews/peer-thread-workflow-history\.md$
